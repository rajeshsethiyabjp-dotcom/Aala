name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip
        run: |
          unzip -o restaurant_lan_3in1_flutter.zip
          cd restaurant_lan_3in1
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build APK
        run: |
          cd restaurant_lan_3in1
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: restaurant-app-apk
          path: restaurant_lan_3in1/build/app/outputs/flutter-apk/app-release.apk
