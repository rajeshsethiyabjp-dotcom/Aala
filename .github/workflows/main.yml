name: Build 3in1 Restaurant APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Android Scaffold, Fix Code & Permissions
        run: |
          unzip -o restaurant_lan_3in1_flutter.zip
          cd restaurant_lan_3in1
          
          # 1. Android Native Project Generate
          flutter create --platforms=android --org com.restaurant.lan .
          
          # 2. Add LAN / Multicast / Wi-Fi Permissions
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>' android/app/src/main/AndroidManifest.xml
          
          # 3. Patch bonsoir breaking API mismatches in code
          sed -i 's/await _broadcast!\.initialize();/await _broadcast!.ready;/g' lib/services/network_manager.dart || true
          sed -i 's/await _discovery!\.initialize();/await _discovery!.ready;/g' lib/services/network_manager.dart || true
          sed -i 's/is BonsoirDiscoveryServiceResolvedEvent/is BonsoirServiceResolvedEvent/g' lib/services/network_manager.dart || true
          sed -i 's/BonsoirDiscoveryServiceResolvedEvent/BonsoirServiceResolvedEvent/g' lib/services/network_manager.dart || true
          sed -i 's/BonsoirDiscoveryEvent/BonsoirEvent/g' lib/services/network_manager.dart || true
          
          # 4. Pub dependencies
          flutter pub get

      - name: Build Billing APK
        run: |
          cd restaurant_lan_3in1
          flutter build apk --release --dart-define=APP_ROLE=billing
          cp build/app/outputs/flutter-apk/app-release.apk ../Restaurant_Billing.apk

      - name: Build Waiter APK
        run: |
          cd restaurant_lan_3in1
          flutter build apk --release --dart-define=APP_ROLE=waiter
          cp build/app/outputs/flutter-apk/app-release.apk ../Restaurant_Waiter.apk

      - name: Build Kitchen APK
        run: |
          cd restaurant_lan_3in1
          flutter build apk --release --dart-define=APP_ROLE=kitchen
          cp build/app/outputs/flutter-apk/app-release.apk ../Restaurant_Kitchen.apk

      - name: Upload All 3 APKs
        uses: actions/upload-artifact@v4
        with:
          name: Restaurant_LAN_APKs
          path: |
            Restaurant_Billing.apk
            Restaurant_Waiter.apk
            Restaurant_Kitchen.apk
