name: Build 3in1 Restaurant APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Project, Overwrite Network Manager & Fix Permissions
        run: |
          unzip -o restaurant_lan_3in1_flutter.zip
          cd restaurant_lan_3in1
          
          # Android Project Generate
          flutter create --platforms=android --org com.restaurant.lan .
          
          # Android Permissions for Local LAN & Multicast
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>' android/app/src/main/AndroidManifest.xml
          
          # Overwrite network_manager.dart with 100% Bonsoir 5.x compatible code
          cat << 'EOF' > lib/services/network_manager.dart
          import 'dart:async';
          import 'dart:io';
          import 'package:flutter/foundation.dart';
          import 'package:bonsoir/bonsoir.dart';

          class NetworkManager extends ChangeNotifier {
            BonsoirBroadcast? _broadcast;
            BonsoirDiscovery? _discovery;
            final String type = '_restaurant-lan._tcp';
            final int port = 8080;

            bool _isBroadcasting = false;
            bool _isDiscovering = false;

            bool get isBroadcasting => _isBroadcasting;
            bool get isDiscovering => _isDiscovering;

            Future<void> startBroadcast({required String name}) async {
              try {
                BonsoirService service = BonsoirService(
                  name: name,
                  type: type,
                  port: port,
                );
                _broadcast = BonsoirBroadcast(service: service);
                await _broadcast!.ready;
                await _broadcast!.start();
                _isBroadcasting = true;
                notifyListeners();
              } catch (e) {
                debugPrint('Broadcast Error: \$e');
              }
            }

            Future<void> stopBroadcast() async {
              if (_broadcast != null) {
                await _broadcast!.stop();
                _isBroadcasting = false;
                notifyListeners();
              }
            }

            Future<void> startDiscovery({required Function(String host, int port) onServiceFound}) async {
              try {
                _discovery = BonsoirDiscovery(type: type);
                await _discovery!.ready;
                _discovery!.eventStream?.listen((event) {
                  if (event.type == BonsoirDiscoveryEventType.discoveryServiceFound) {
                    event.service?.resolve(_discovery!.serviceResolver);
                  } else if (event.type == BonsoirDiscoveryEventType.discoveryServiceResolved) {
                    final resolvedService = event.service;
                    if (resolvedService != null) {
                      String? host = resolvedService.attributes['host'] ?? '127.0.0.1';
                      onServiceFound(host, resolvedService.port);
                    }
                  }
                });
                await _discovery!.start();
                _isDiscovering = true;
                notifyListeners();
              } catch (e) {
                debugPrint('Discovery Error: \$e');
              }
            }

            Future<void> stopDiscovery() async {
              if (_discovery != null) {
                await _discovery!.stop();
                _isDiscovering = false;
                notifyListeners();
              }
            }
          }
          EOF
          
          flutter pub get

      - name: Build Billing APK
        run: |
          cd restaurant_lan_3in1
          flutter build apk --release --no-tree-shake-icons --dart-define=APP_ROLE=billing
          cp build/app/outputs/flutter-apk/app-release.apk ../Restaurant_Billing.apk

      - name: Build Waiter APK
        run: |
          cd restaurant_lan_3in1
          flutter build apk --release --no-tree-shake-icons --dart-define=APP_ROLE=waiter
          cp build/app/outputs/flutter-apk/app-release.apk ../Restaurant_Waiter.apk

      - name: Build Kitchen APK
        run: |
          cd restaurant_lan_3in1
          flutter build apk --release --no-tree-shake-icons --dart-define=APP_ROLE=kitchen
          cp build/app/outputs/flutter-apk/app-release.apk ../Restaurant_Kitchen.apk

      - name: Upload All 3 APKs
        uses: actions/upload-artifact@v4
        with:
          name: Restaurant_LAN_APKs
          path: |
            Restaurant_Billing.apk
            Restaurant_Waiter.apk
            Restaurant_Kitchen.apk
            
