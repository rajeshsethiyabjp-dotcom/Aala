name: Build 3in1 Restaurant APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Project, Force SDK 36 on All Plugins & Fix Permissions
        run: |
          unzip -o restaurant_lan_3in1_flutter.zip
          cd restaurant_lan_3in1
          
          # 1. Android Project Scaffolding
          flutter create --platforms=android --org com.restaurant.lan .
          
          # 2. Add LAN / Multicast / Wi-Fi Permissions
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>' android/app/src/main/AndroidManifest.xml
          
          # 3. Globally force compileSdk 36 across ALL subprojects and plugins (like bonsoir_android)
          cat << 'EOF' >> android/build.gradle
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF
          
          if [ -f android/build.gradle.kts ]; then
          cat << 'EOF' >> android/build.gradle.kts
          subprojects {
              afterEvaluate {
                  extensions.findByType(com.android.build.gradle.BaseExtension::class.java)?.apply {
                      compileSdkVersion(36)
                  }
              }
          }
          EOF
          fi
          
          # 4. Patch Bonsoir API code
          python3 -c "
          p = 'lib/services/network_manager.dart'
          with open(p, 'r') as f:
              c = f.read()
          c = c.replace('await _broadcast!.initialize();', 'await _broadcast!.ready;')
          c = c.replace('await _discovery!.initialize();', 'await _discovery!.ready;')
          c = c.replace('event is BonsoirDiscoveryServiceResolvedEvent', 'event.type == BonsoirDiscoveryEventType.discoveryServiceResolved')
          c = c.replace('event is BonsoirDiscoveryServiceFoundEvent', 'event.type == BonsoirDiscoveryEventType.discoveryServiceFound')
          c = c.replace('BonsoirDiscoveryServiceResolvedEvent', 'BonsoirDiscoveryEvent')
          c = c.replace('BonsoirDiscoveryServiceFoundEvent', 'BonsoirDiscoveryEvent')
          c = c.replace('service.resolve(_discovery!.serviceResolver)', 'service?.resolve(_discovery!.serviceResolver)')
          c = c.replace('_discovery!.eventStream.listen', '_discovery!.eventStream!.listen')
          c = c.replace('final host = service.host;', 'final host = (service as dynamic)?.host ?? \"127.0.0.1\";')
          c = c.replace('final p = service.port;', 'final p = (service as dynamic)?.port ?? 8080;')
          c = c.replace('service.host', '((service as dynamic)?.host ?? \"127.0.0.1\")')
          c = c.replace('service.port', '((service as dynamic)?.port ?? 8080)')
          with open(p, 'w') as f:
              f.write(c)
          "
          
          flutter pub get

      - name: Build Billing APK
        run: |
          cd restaurant_lan_3in1
          flutter build apk --release --no-tree-shake-icons --dart-define=APP_ROLE=billing
          cp build/app/outputs/flutter-apk/app-release.apk ../Restaurant_Billing.apk

      - name: Build Waiter APK
        run: |
          cd restaurant_lan_3in1
          flutter build apk --release --no-tree-shake-icons --dart-define=APP_ROLE=waiter
          cp build/app/outputs/flutter-apk/app-release.apk ../Restaurant_Waiter.apk

      - name: Build Kitchen APK
        run: |
          cd restaurant_lan_3in1
          flutter build apk --release --no-tree-shake-icons --dart-define=APP_ROLE=kitchen
          cp build/app/outputs/flutter-apk/app-release.apk ../Restaurant_Kitchen.apk

      - name: Upload All 3 APKs
        uses: actions/upload-artifact@v4
        with:
          name: Restaurant_LAN_APKs
          path: |
            Restaurant_Billing.apk
            Restaurant_Waiter.apk
            Restaurant_Kitchen.apk
            
